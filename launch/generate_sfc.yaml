session_name: generate_sfc
windows:
  - window_name: main
    layout: tiled
    shell_command_before:
      - export ROS_DOMAIN_ID=7
    
    panes:
      # base station
      # - shell_command:
      - shell_command:
        - ros2 launch mighty simulator.launch.py

      # run SFC generator
      - shell_command:
        - sleep 5
        - ros2 run mighty corridor_generator_node --ros-args -p max_dist_vertexes:=6.0