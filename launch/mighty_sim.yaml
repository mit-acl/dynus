session_name: mighty_sim
windows:
  - window_name: main
    layout: tiled
    shell_command_before:
    - |
      if [ -z "$SETUP_BASH" ] || [ ! -f "$SETUP_BASH" ]; then
        echo "[ERROR] SETUP_BASH is missing or invalid: $SETUP_BASH" >&2
        exit 1
      fi
      . "$SETUP_BASH"
    - export ROS_DOMAIN_ID=7
    
    panes:
      # base station
      - shell_command:
        - ros2 launch mighty base_mighty.launch.py use_dyn_obs:=false use_gazebo_gui:=false use_rviz:=true env:=hard_forest

      # NX01 ACL Mapper
      - shell_command:
        - sleep 5
        - ros2 launch global_mapper_ros global_mapper_node.launch.py quad:=NX01 depth_pointcloud_topic:=mid360_PointCloud2
      
      # NX01 Planner
      - shell_command:
        - sleep 5
        - ros2 launch mighty onboard_mighty.launch.py namespace:=NX01 x:=0.0 y:=0.0 z:=3.0 yaw:=0.0

      # goal monitor (spawns GoalMonitorNode for NX01..NX08)
      - shell_command:
        - sleep 10
        - ros2 launch mighty goal_monitor.launch.py



