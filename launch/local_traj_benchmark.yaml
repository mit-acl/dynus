session_name: local_traj_benchmark
windows:
  - window_name: main
    layout: tiled
    shell_command_before:
      - export ROS_DOMAIN_ID=20
    
    panes:
      # base station
      # - shell_command:
      - shell_command:
        - ros2 launch dynus simulator.launch.py

      # run benchmark (dynus2, faster)
      - shell_command:
        - sleep 5
        - ros2 launch dynus local_traj_benchmark.launch.py