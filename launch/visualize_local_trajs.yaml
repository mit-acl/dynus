session_name: visualize_local_trajs
windows:
  - window_name: main
    layout: tiled
    shell_command_before:
      - export ROS_DOMAIN_ID=20
    
    panes:
      # base station
      # - shell_command:
      - shell_command:
        - ros2 launch dynus simulator.launch.py

      # run benchmark (dynus, dynus_star, faster) (mode: loop, screenshot)
      - shell_command:
        - sleep 2
        - ros2 run dynus visualize_local_trajs_node --ros-args -p viz_enable_z_offset:=true -p viz_z_step:=0.05 -p mode:=loop -p viz_enable_halo:=false -p alpha_pts_base:=1.0 -p viz_alpha_line_base:=1.0



